# Publish the oc-workers CLI to npm when a version tag is pushed (v1.2.3 → oc-workers@1.2.3), then make
# the GitHub release from that version's CHANGELOG.md section.
# Uses npm trusted publishing (OIDC): no npm token is stored. Set it up once on npmjs.com:
# package oc-workers → Settings → Trusted publisher → GitHub Actions, repository meirdick/oc-workers,
# workflow release.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches the CLI version
        run: |
          want="v$(node -p "require('./cli/package.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/package.json ($want)"; exit 1
          fi
      - name: CLI tests
        working-directory: cli
        run: npx vitest run
      - name: Publish
        working-directory: cli
        run: npm publish --provenance --access public
      - name: GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e '
            const [v] = process.argv.slice(1);
            const s = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const m = s.split(/^## /m).find((p) => p.split("\n", 1)[0].trim() === v);
            if (!m) { console.error("No CHANGELOG section for " + v); process.exit(1); }
            process.stdout.write("## " + m.trim() + "\n");
          ' "$v" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "oc-workers $v" --notes-file notes.md --verify-tag
